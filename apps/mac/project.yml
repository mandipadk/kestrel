# Kestrel for Mac: a menu bar and window app whose tunnel is a system
# extension, sharing its engine, tunnel and design code with the iPhone app
# (../shared). Shipped outside the App Store: signed with the owner's
# Developer ID, notarized, as a .dmg. Generate the Xcode project with
# `xcodegen` (see .github/workflows/apple.yml), which also passes the
# Developer ID provisioning profiles. Updates itself with Sparkle from the
# signed appcast CI publishes on the mac-latest release.
name: KestrelMac
options:
  bundleIdPrefix: dev.mandip
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  # pinned: CI builds the same version's sparkle-cli for the update test
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Developer ID Application
    OTHER_CODE_SIGN_FLAGS: --timestamp
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  Kestrel:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: ../shared/TunnelModel.swift
      - path: ../shared/DeviceKey.swift
      - path: ../shared/Theme.swift
      - path: ../shared/Fonts
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Kestrel
        CFBundleDisplayName: Kestrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ATSApplicationFontsPath: "."
        ITSAppUsesNonExemptEncryption: false
        # a menu bar app: no Dock icon and no main window
        LSUIElement: true
        NSSystemExtensionUsageDescription: Kestrel's tunnel runs as a network extension that sends this Mac's traffic through your Frankfurt exit.
        NSHumanReadableCopyright: Kestrel, a private Geph exit. MPL 2.0.
        NSLocationUsageDescription: macOS only tells an app your Wi-Fi network's name with this permission. Kestrel uses it to trust Wi-Fi you choose and never reads your location.
        NSLocationWhenInUseUsageDescription: macOS only tells an app your Wi-Fi network's name with this permission. Kestrel uses it to trust Wi-Fi you choose and never reads your location.
        # kestrel1: links from the Kestrel page set the Mac up
        CFBundleURLTypes:
          - CFBundleURLName: dev.mandip.kestrel.setup
            CFBundleURLSchemes: [kestrel1]
        # Sparkle: CI signs each .dmg and the feed itself with the EdDSA key
        # whose public half is here (private half: SPARKLE_ED_KEY)
        SUFeedURL: https://github.com/mandipadk/kestrel/releases/download/mac-latest/appcast.xml
        SUPublicEDKey: pHkJv+GprSFixQT95qmbpafGJkG7UkpCQsz3hHVNBNg=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: App/Kestrel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider-systemextension]
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups: [UK74VYMUP7.dev.mandip.kestrel]
        # CoreWLAN only names the Wi-Fi with location permission
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.kestrel
        PRODUCT_NAME: Kestrel
        # Updates.swift uses Sparkle only in the app, not the screenshot tests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SPARKLE
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PROVISIONING_PROFILE_SPECIFIER: ${MAC_APP_PROFILE}
    dependencies:
      - target: KestrelTunnel
      - package: Sparkle
  KestrelTunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: Tunnel
      - path: ../shared/PacketTunnelProvider.swift
      - path: ../shared/Engine.swift
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Kestrel Tunnel
        # macOS only files a system extension under a category (here, network
        # extensions) when its package type is SYSX
        CFBundlePackageType: SYSX
        # sysextd refuses a network extension without this, in the extension's own plist
        NSSystemExtensionUsageDescription: Kestrel's tunnel runs as a network extension that sends this Mac's traffic through your Frankfurt exit.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NetworkExtension:
          NEMachServiceName: UK74VYMUP7.dev.mandip.kestrel.tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/KestrelTunnel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.application-groups: [UK74VYMUP7.dev.mandip.kestrel]
        com.apple.developer.networking.networkextension: [packet-tunnel-provider-systemextension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.kestrel.tunnel
        # macOS finds a system extension by its file name: <bundle id>.systemextension
        PRODUCT_NAME: dev.mandip.kestrel.tunnel
        PRODUCT_MODULE_NAME: KestrelTunnel
        PROVISIONING_PROFILE_SPECIFIER: ${MAC_TUNNEL_PROFILE}
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../shared/Geph.h
        # the universal (arm64 + x86_64) static engine, linked by path
        OTHER_LDFLAGS: [$(SRCROOT)/../../target/universal-apple-darwin/release/libgeph5_client.a, -lresolv, -lz, -framework, Security, -framework, SystemConfiguration]
  EngineTests:
    # Runs the Mac engine and sends real packets through the exit; also
    # renders the screens to PNGs for review.
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../shared/Tests
      - path: Tests
      - path: ../shared/Engine.swift
      - path: ../shared/TunnelModel.swift
      - path: ../shared/DeviceKey.swift
      - path: ../shared/Theme.swift
      - path: App/MacViews.swift
      - path: App/MacSupport.swift
      - path: App/Updates.swift
      - path: ../shared/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.kestrel.enginetests
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../shared/Geph.h
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        OTHER_LDFLAGS: [$(SRCROOT)/../../target/universal-apple-darwin/release/libgeph5_client.a, -lresolv, -lz, -framework, Security, -framework, SystemConfiguration]
schemes:
  Kestrel:
    build:
      targets:
        Kestrel: all
        KestrelTunnel: all
    archive:
      config: Release
  EngineTests:
    build:
      targets:
        EngineTests: [test]
    test:
      config: Release
      targets: [EngineTests]
