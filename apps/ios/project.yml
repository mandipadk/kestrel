# Kestrel for iPhone. Generate the Xcode project with `xcodegen` (see .github/workflows/apple.yml).
# Code shared with the Mac app lives in ../shared.
name: Kestrel
options:
  bundleIdPrefix: dev.mandip
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
targets:
  Kestrel:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../shared/TunnelModel.swift
      - path: ../shared/DeviceKey.swift
      - path: ../shared/Theme.swift
      - path: ../shared/Fonts
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kestrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Scan the setup code shown on your Kestrel page.
        UIAppFonts: [Geist.ttf, GeistMono.ttf]
        ITSAppUsesNonExemptEncryption: false
        # kestrel1: links from the Kestrel page set the iPhone up
        CFBundleURLTypes:
          - CFBundleURLName: dev.mandip.kestrel.setup
            CFBundleURLSchemes: [kestrel1]
    entitlements:
      path: App/Kestrel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        # to name the current Wi-Fi when the owner trusts it
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.kestrel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KestrelTunnel
  KestrelTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: ../shared/PacketTunnelProvider.swift
      - path: ../shared/Engine.swift
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Kestrel Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/KestrelTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.kestrel.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../shared/Geph.h
        # Link the static archive by path: a -l search also finds the cdylib
        # and prefers it, leaving the extension needing a library iOS can't load.
        OTHER_LDFLAGS: [$(SRCROOT)/../../target/aarch64-apple-ios/release/libgeph5_client.a, -lresolv, -lz, -framework, Security, -framework, SystemConfiguration]
        # the Simulator (screenshots) needs the engine built for it
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": [$(SRCROOT)/../../target/aarch64-apple-ios-sim/release/libgeph5_client.a, -lresolv, -lz, -framework, Security, -framework, SystemConfiguration]
        DEAD_CODE_STRIPPING: YES
  EngineTests:
    # Runs the iOS engine in the Simulator and sends real packets through the exit.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../shared/Tests
      - path: ../shared/Engine.swift
      - path: ../shared/TunnelModel.swift
      - path: ../shared/DeviceKey.swift
      - path: ../shared/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.kestrel.enginetests
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../shared/Geph.h
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        OTHER_LDFLAGS: [$(SRCROOT)/../../target/aarch64-apple-ios-sim/release/libgeph5_client.a, -lresolv, -lz, -framework, Security, -framework, SystemConfiguration]
  Screens:
    # Launches the app with sample data and screenshots each screen.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.kestrel.screens
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kestrel
    dependencies:
      - target: Kestrel
schemes:
  Kestrel:
    build:
      targets:
        Kestrel: all
        KestrelTunnel: all
    archive:
      config: Release
  EngineTests:
    build:
      targets:
        EngineTests: [test]
    test:
      config: Release
      targets: [EngineTests]
  Screens:
    build:
      targets:
        Screens: [test]
    test:
      config: Debug
      targets: [Screens]
