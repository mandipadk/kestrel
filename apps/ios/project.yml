# Kestrel for iPhone. Generate the Xcode project with `xcodegen` (see .github/workflows/apple.yml).
name: Kestrel
options:
  bundleIdPrefix: dev.mandip
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: ${BUILD_NUMBER}
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
targets:
  Kestrel:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kestrel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan the setup code shown on your Kestrel page.
        UIAppFonts: [Geist.ttf, GeistMono.ttf]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Kestrel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.kestrel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KestrelTunnel
  KestrelTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Tunnel
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Kestrel Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Tunnel/KestrelTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mandip.kestrel.tunnel
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/Geph.h
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: [-lgeph5_client, -lresolv, -lz, -framework, Security, -framework, SystemConfiguration]
        DEAD_CODE_STRIPPING: YES
