[package]
name = "kestrelctl"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Manage the devices allowed to use a Kestrel private exit"

[dependencies]
geph5-misc-rpc = { path = "../../libraries/geph5-misc-rpc" }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
ed25519-dalek = { version = "2", default-features = false }
hex = "0.4.3"
time = { version = "0.3.55", features = ["formatting"] }
