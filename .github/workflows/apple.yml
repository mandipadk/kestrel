# Builds Kestrel's Apple apps on GitHub's macOS runners:
#   - the Mac app (menu bar + window, tunnel as a system extension), tested
#     against the live exit, signed with the owner's Developer ID, notarized,
#     and published as Kestrel.dmg on the mac-latest release (the Kestrel page
#     links there), with a signed Sparkle appcast the app updates itself from;
#     each release is first tested by updating an older copy on the runner
#   - the iPhone app, tested in the Simulator against the live exit and sent
#     to TestFlight
# Each job also keeps screenshots of its screens (sample data) as an artifact.
name: apple

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the iPhone build to TestFlight and publish the Mac .dmg
        type: boolean
        default: true
  push:
    branches: [kestrel]
    paths:
      - apps/**
      - binaries/geph5-client/**
      - libraries/geph5-misc-rpc/**
      - libraries/sillad-sosistab3/**
      - .github/workflows/apple.yml

concurrency:
  group: apple
  cancel-in-progress: true

env:
  DEVELOPMENT_TEAM: UK74VYMUP7
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      MAC_APP_PROFILE: Kestrel Mac Developer ID
      MAC_TUNNEL_PROFILE: Kestrel Tunnel Developer ID
      # the half of SPARKLE_ED_KEY the app trusts (SUPublicEDKey in project.yml)
      SPARKLE_PUBLIC_KEY: pHkJv+GprSFixQT95qmbpafGJkG7UkpCQsz3hHVNBNg=
      RELEASES: https://github.com/mandipadk/kestrel/releases/download
    steps:
      - uses: actions/checkout@v4
        with:
          # enough history for the update's release notes
          fetch-depth: 300
      - name: Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: mac-app
      - name: Build the engine (universal)
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          cargo build --release -p geph5-client --lib --target aarch64-apple-darwin
          cargo build --release -p geph5-client --lib --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/libgeph5_client.a \
            target/aarch64-apple-darwin/release/libgeph5_client.a \
            target/x86_64-apple-darwin/release/libgeph5_client.a
          lipo -info target/universal-apple-darwin/release/libgeph5_client.a
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/mac && xcodegen generate
      - name: Engine test (real packets through the exit) and screenshots
        env:
          TEST_RUNNER_KESTREL_CODE: ${{ secrets.KESTREL_CI_CODE }}
          TEST_RUNNER_SNAPSHOT_DIR: ${{ runner.temp }}/screens
        run: |
          set -o pipefail
          cd apps/mac
          xcodebuild test -project KestrelMac.xcodeproj -scheme EngineTests -configuration Release \
            -destination 'platform=macOS' | xcbeautify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-mac
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 14
      # Signing needs the owner's Developer ID certificate (MAC_DEVID_P12, base64,
      # and MAC_DEVID_PASSWORD). Until it is there, the build stops after the tests.
      - name: Developer ID certificate
        id: devid
        env:
          P12: ${{ secrets.MAC_DEVID_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVID_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::notice::No Developer ID certificate yet; skipping signing and the .dmg"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS=$(openssl rand -hex 16)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/devid.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          SERIAL=$(security find-certificate -c "Developer ID Application" -p "$KC" | openssl x509 -noout -serial | cut -d= -f2)
          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: API key and profiles
        if: steps.devid.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install 'pyjwt[crypto]'
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          PY="$RUNNER_TEMP/venv/bin/python"
          $PY apps/asc.py capability dev.mandip.kestrel SYSTEM_EXTENSION_INSTALL
          $PY apps/asc.py bundle dev.mandip.kestrel
          $PY apps/asc.py bundle dev.mandip.kestrel.tunnel
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do mkdir -p "$d"; done
          $PY apps/asc.py devid-profile dev.mandip.kestrel "$MAC_APP_PROFILE" "${{ steps.devid.outputs.serial }}" "$RUNNER_TEMP/app.provisionprofile"
          $PY apps/asc.py devid-profile dev.mandip.kestrel.tunnel "$MAC_TUNNEL_PROFILE" "${{ steps.devid.outputs.serial }}" "$RUNNER_TEMP/tunnel.provisionprofile"
          for f in app tunnel; do
            U=$(security cms -D -i "$RUNNER_TEMP/$f.provisionprofile" | plutil -extract UUID raw -)
            cp "$RUNNER_TEMP/$f.provisionprofile" "$HOME/Library/MobileDevice/Provisioning Profiles/$U.provisionprofile"
            cp "$RUNNER_TEMP/$f.provisionprofile" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$U.provisionprofile"
          done
      - name: Archive (Developer ID)
        if: steps.devid.outputs.ready == 'true'
        run: |
          set -o pipefail
          cd apps/mac
          xcodebuild -project KestrelMac.xcodeproj -scheme Kestrel -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/KestrelMac.xcarchive" \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            archive | xcbeautify
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>provisioningProfiles</key><dict>
              <key>dev.mandip.kestrel</key><string>$MAC_APP_PROFILE</string>
              <key>dev.mandip.kestrel.tunnel</key><string>$MAC_TUNNEL_PROFILE</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/KestrelMac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
      - name: Check the app
        if: steps.devid.outputs.ready == 'true'
        run: |
          APP="$RUNNER_TEMP/export/Kestrel.app"
          EXT="$APP/Contents/Library/SystemExtensions/dev.mandip.kestrel.tunnel.systemextension"
          lipo -info "$EXT/Contents/MacOS/dev.mandip.kestrel.tunnel" || lipo -info "$EXT/Contents/MacOS/"*
          # a universal binary lists each architecture; only the indented lines are libraries
          if otool -L "$EXT/Contents/MacOS/"* | grep -E '^\s+\S' | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then
            echo "::error::the tunnel extension links a library that is not part of macOS"; exit 1
          fi
          codesign -d --entitlements - "$APP" 2>/dev/null
          codesign -d --entitlements - "$EXT" 2>/dev/null
          # what sysextd checks before it installs the tunnel; fails the build if any is off
          apps/mac/check-extension.sh "$APP"
      - name: Disk image, notarized
        if: steps.devid.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$RUNNER_TEMP/export/Kestrel.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Kestrel -srcfolder "$STAGE" -fs HFS+ -format UDZO -ov "$RUNNER_TEMP/Kestrel.dmg"
          codesign --sign "Developer ID Application" --timestamp "$RUNNER_TEMP/Kestrel.dmg"
          xcrun notarytool submit "$RUNNER_TEMP/Kestrel.dmg" --key "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          ID=$(plutil -extract id raw "$RUNNER_TEMP/notary.json")
          if [[ $(plutil -extract status raw "$RUNNER_TEMP/notary.json") != Accepted ]]; then
            xcrun notarytool log "$ID" --key "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            echo "::error::notarization was not accepted"; exit 1
          fi
          # Apple's ticket service sometimes drops the connection; the ticket is there, so try again
          for i in 1 2 3 4 5; do xcrun stapler staple "$RUNNER_TEMP/Kestrel.dmg" && break; [[ $i == 5 ]] && exit 1; sleep $((i * 15)); done
          for i in 1 2 3 4 5; do xcrun stapler validate "$RUNNER_TEMP/Kestrel.dmg" && break; [[ $i == 5 ]] && exit 1; sleep $((i * 15)); done
          spctl --assess --type open --context context:primary-signature -vv "$RUNNER_TEMP/Kestrel.dmg"
          # and the app exactly as the owner gets it, from the stapled disk image
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$RUNNER_TEMP/Kestrel.dmg" >/dev/null
          rc=0; apps/mac/check-extension.sh "$MNT/Kestrel.app" || rc=1
          apps/mac/check-update.sh "$MNT/Kestrel.app" "$SPARKLE_PUBLIC_KEY" || rc=1
          spctl --assess --type execute -vv "$MNT/Kestrel.app" || rc=1
          hdiutil detach "$MNT" >/dev/null
          exit $rc
      # The real thing, not a list of checks: install the app from the stapled
      # .dmg into /Applications and have it ask sysextd for the tunnel. macOS
      # validates the extension first; passing means it waits for approval.
      - name: Install test (sysextd accepts the tunnel)
        if: steps.devid.outputs.ready == 'true'
        run: |
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$RUNNER_TEMP/Kestrel.dmg" >/dev/null
          sudo rm -rf /Applications/Kestrel.app
          ditto "$MNT/Kestrel.app" /Applications/Kestrel.app
          hdiutil detach "$MNT" >/dev/null
          /Applications/Kestrel.app/Contents/MacOS/Kestrel --check-extension & PID=$!
          for _ in $(seq 120); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          rc=0
          if kill -0 $PID 2>/dev/null; then kill $PID; echo "::error::no answer from sysextd in 2 minutes"; rc=1
          else wait $PID || { rc=$?; echo "::error::sysextd refused the tunnel extension (see above)"; }; fi
          systemextensionsctl list || true
          log show --last 3m --style compact --predicate 'process == "sysextd"' | tail -40 || true
          exit $rc
      - uses: actions/upload-artifact@v4
        if: steps.devid.outputs.ready == 'true'
        with:
          name: kestrel-mac-dmg
          path: ${{ runner.temp }}/Kestrel.dmg
          retention-days: 30
      # In-app updates: Sparkle's sign_update signs the .dmg and the feed with
      # SPARKLE_ED_KEY; the app refuses anything that doesn't verify against
      # SPARKLE_PUBLIC_KEY. The Sparkle version is the one project.yml pins.
      - name: Sparkle tools
        if: steps.devid.outputs.ready == 'true'
        run: |
          V=$(sed -n 's/^ *exactVersion: *//p' apps/mac/project.yml)
          SPK="$RUNNER_TEMP/sparkle"
          mkdir -p "$SPK"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$V/Sparkle-$V.tar.xz" | tar -xJ -C "$SPK"
          # sparkle-cli isn't in the download any more; build it to test the update
          git clone -q --depth 1 --branch "$V" https://github.com/sparkle-project/Sparkle "$RUNNER_TEMP/sparkle-src"
          xcodebuild -project "$RUNNER_TEMP/sparkle-src/Sparkle.xcodeproj" -scheme sparkle-cli -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/sparkle-dd" CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            build | xcbeautify
          CLI=$(find "$RUNNER_TEMP/sparkle-dd/Build/Products/Release" -type f -perm +111 -path '*.app/Contents/MacOS/*' | grep -i sparkle | head -1)
          [[ -x "$CLI" ]] || { echo "::error::sparkle-cli did not build"; exit 1; }
          echo "SPARKLE_CLI=$CLI" >> "$GITHUB_ENV"
          echo "SIGN_UPDATE=$SPK/bin/sign_update" >> "$GITHUB_ENV"
      - name: Sign the update and its feed
        if: steps.devid.outputs.ready == 'true'
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ -n "$SPARKLE_ED_KEY" ]] || { echo "::error::SPARKLE_ED_KEY is not set"; exit 1; }
          KEY="$RUNNER_TEMP/keys/sparkle.key"
          ( umask 077; printf '%s' "$SPARKLE_ED_KEY" > "$KEY" )
          DMG="$RUNNER_TEMP/Kestrel.dmg"
          SIG=$("$SIGN_UPDATE" --ed-key-file "$KEY" -p "$DMG")
          "$RUNNER_TEMP/venv/bin/python" apps/mac/appcast.py verify --public-key "$SPARKLE_PUBLIC_KEY" --signature "$SIG" "$DMG"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/export/Kestrel.app/Contents/Info.plist")
          # release notes: what changed in the apps since the build on mac-latest
          PREV=$(gh release view mac-latest --json body -q .body 2>/dev/null | grep -oE 'Built from [0-9a-f]{7}' | cut -d' ' -f3 || true)
          RANGE=HEAD~10..HEAD
          [[ -n "$PREV" ]] && git cat-file -e "$PREV" 2>/dev/null && RANGE="$PREV..HEAD"
          git log --no-merges --format='- %s' "$RANGE" -- apps/mac apps/shared | head -20 > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] || echo "- Upstream Geph changes and fixes" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          mkdir -p "$RUNNER_TEMP/feed"
          python3 apps/mac/appcast.py feed --build "$BUILD_NUMBER" --short "$SHORT" \
            --url "$RELEASES/mac-b$BUILD_NUMBER/Kestrel.dmg" --length "$(stat -f%z "$DMG")" --signature "$SIG" \
            --notes "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/feed/appcast.xml"
          "$SIGN_UPDATE" --ed-key-file "$KEY" "$RUNNER_TEMP/feed/appcast.xml"
          tail -5 "$RUNNER_TEMP/feed/appcast.xml"
          # the same feed with one changed byte and the old signature: the update test must refuse it
          sed 's/<title>Kestrel /<title>Kestrel  /' "$RUNNER_TEMP/feed/appcast.xml" > "$RUNNER_TEMP/feed/appcast-tampered.xml"
          cmp -s "$RUNNER_TEMP/feed/appcast.xml" "$RUNNER_TEMP/feed/appcast-tampered.xml" && { echo "::error::tampering changed nothing"; exit 1; }
          rm -f "$KEY"
      # Each build gets its own release (mac-b<N>), which the feed points at, so
      # a feed and its .dmg never disagree. It is tested there before mac-latest
      # moves to it.
      - name: Stage the release
        if: steps.devid.outputs.ready == 'true' && (github.event_name == 'push' || inputs.testflight)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mac-b$BUILD_NUMBER"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "Kestrel for Mac, build $BUILD_NUMBER" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" "$RUNNER_TEMP/Kestrel.dmg" "$RUNNER_TEMP/feed/appcast.xml" "$RUNNER_TEMP/feed/appcast-tampered.xml" --clobber
      - name: Update test (an older Kestrel updates itself to this build)
        if: steps.devid.outputs.ready == 'true' && (github.event_name == 'push' || inputs.testflight)
        run: |
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$RUNNER_TEMP/Kestrel.dmg" >/dev/null
          rc=0
          apps/mac/test-update.sh "$MNT/Kestrel.app" "$SPARKLE_CLI" \
            "$RELEASES/mac-b$BUILD_NUMBER/appcast.xml" "$RELEASES/mac-b$BUILD_NUMBER/appcast-tampered.xml" || rc=$?
          hdiutil detach "$MNT" >/dev/null
          exit $rc
      - name: Publish for the Kestrel page and in-app updates
        if: steps.devid.outputs.ready == 'true' && (github.event_name == 'push' || inputs.testflight)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view mac-latest >/dev/null 2>&1 || \
            gh release create mac-latest --title "Kestrel for Mac" --prerelease \
              --notes "The latest Kestrel for Mac, signed with Developer ID and notarized. Built from ${GITHUB_SHA::7}."
          gh release upload mac-latest "$RUNNER_TEMP/Kestrel.dmg" "$RUNNER_TEMP/feed/appcast.xml" --clobber
          gh release edit mac-latest --notes "The latest Kestrel for Mac (build $BUILD_NUMBER), signed with Developer ID and notarized. Built from ${GITHUB_SHA::7}."
          gh release delete-asset "mac-b$BUILD_NUMBER" appcast-tampered.xml --yes || true
          # keep the last five builds' releases
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E '^mac-b[0-9]+$' | sort -t b -k2 -n -r | tail -n +6 |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
      - name: Clean up the key and keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Rust target
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios
      - name: Build the engine
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: cargo build --release -p geph5-client --lib --target aarch64-apple-ios
      - name: Engine for the Simulator
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        run: cargo build --release -p geph5-client --lib --target aarch64-apple-ios-sim
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd apps/ios && xcodegen generate
      - name: Pick a Simulator
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "simulator $SIM"
          echo "SIM=$SIM" >> "$GITHUB_ENV"
      - name: Engine test (Simulator, real packets through the exit)
        env:
          TEST_RUNNER_KESTREL_CODE: ${{ secrets.KESTREL_CI_CODE }}
        run: |
          set -o pipefail
          cd apps/ios
          xcodebuild test -project Kestrel.xcodeproj -scheme EngineTests -configuration Release \
            -destination "id=$SIM" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES | xcbeautify
      - name: Screenshots (sample data)
        run: |
          set -o pipefail
          cd apps/ios
          xcodebuild test -project Kestrel.xcodeproj -scheme Screens -destination "id=$SIM" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -resultBundlePath "$RUNNER_TEMP/screens.xcresult" CODE_SIGNING_ALLOWED=NO | xcbeautify
          mkdir -p "$RUNNER_TEMP/screens"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/screens.xcresult" --output-path "$RUNNER_TEMP/screens"
          ls -la "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-iphone
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 14
      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" -q install 'pyjwt[crypto]'
      - name: Capabilities (Wi-Fi name for trusted networks)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          "$RUNNER_TEMP/venv/bin/python" apps/asc.py capability dev.mandip.kestrel ACCESS_WIFI_INFORMATION
          "$RUNNER_TEMP/venv/bin/python" apps/asc.py bundle dev.mandip.kestrel
      # CI's lasting development identity: without it, Xcode makes a new
      # certificate on every throwaway runner until the team's limit is hit.
      - name: Development identity
        env:
          P12: ${{ secrets.IOS_DEV_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DEV_PASSWORD }}
        run: |
          [[ -n "$P12" ]] || { echo "::warning::no IOS_DEV_P12; Xcode will make a new development certificate"; exit 0; }
          KC="$RUNNER_TEMP/dev.keychain-db"
          KCPASS=$(openssl rand -hex 16)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dev.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cd apps/ios
          xcodebuild -project Kestrel.xcodeproj -scheme Kestrel -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kestrel.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            archive | xcbeautify
      - name: Check the extension only needs system libraries
        run: |
          EXT="$RUNNER_TEMP/Kestrel.xcarchive/Products/Applications/Kestrel.app/PlugIns/KestrelTunnel.appex/KestrelTunnel"
          otool -L "$EXT"
          if otool -L "$EXT" | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then
            echo "::error::the tunnel extension links a library that is not part of iOS"; exit 1
          fi
      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kestrel.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Clean up the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
